<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ロコ庵 清掃の承認</title>
<style>
  :root{
    --blue:#4A90C3; --blue-deep:#2E6A99; --ink:#22303C; --muted:#7A8896;
    --line:#E3E9EF; --bg:#F4F7FA; --card:#FFFFFF;
    --done-bg:#EAF6EE; --done-mark:#3FA05F;
    --warn-bg:#FDECEC; --warn-ink:#C0392B; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;}
  header{position:sticky; top:0; z-index:5; background:var(--blue); color:#fff; padding:14px 16px;}
  .h-title{font-size:17px; font-weight:600;}
  .h-sub{font-size:12px; opacity:.9; margin-top:1px;}
  .wrap{max-width:640px; margin:0 auto; padding:14px 14px 40px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 1px 3px rgba(20,40,60,.05); margin-bottom:14px; overflow:hidden;}
  .c-head{padding:14px 16px 6px;}
  .c-top{display:flex; justify-content:space-between; align-items:center;}
  .c-fac{font-size:17px; font-weight:600;}
  .pill{font-size:12px; padding:3px 10px; border-radius:20px; background:#FBF0DD; color:#9A6B12; white-space:nowrap;}
  .c-meta{font-size:13px; color:var(--muted); margin-top:5px;}
  .photos{display:flex; gap:8px; flex-wrap:wrap; padding:8px 16px 4px;}
  .ph{width:calc(33.33% - 6px); aspect-ratio:1; border-radius:10px; overflow:hidden;
    background:#EEF2F6; border:1px solid var(--line);}
  .ph a{display:block; width:100%; height:100%;}
  .ph img{width:100%; height:100%; object-fit:cover; display:block;}
  .no-photo{font-size:13px; color:var(--muted); padding:4px 16px 8px;}
  .acts{display:flex; gap:10px; padding:10px 16px 16px;}
  .btn{flex:1; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:600; cursor:pointer;}
  .btn-ok{background:var(--done-mark); color:#fff;}
  .btn-ng{background:#fff; color:var(--warn-ink); border:1px solid #E7C4C0;}
  .btn:disabled{opacity:.5;}
  .empty{text-align:center; color:var(--muted); padding:48px 16px; font-size:14px;}
  .note{font-size:12px; color:var(--muted); text-align:center; margin-top:14px;}
  .reload{display:block; margin:6px auto 0; background:none; border:none; color:var(--blue-deep);
    font-size:13px; cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>
<header>
  <div class="h-title">ロコ庵 清掃の承認</div>
  <div class="h-sub" id="hsub">承認待ちを読み込み中…</div>
</header>
<div class="wrap">
  <div id="list"></div>
  <button class="reload" onclick="load()">↻ 再読み込み</button>
  <div class="note">写真を確認して「承認」。やり直しが必要なら「差し戻し」。</div>
</div>

<script>
  var CONFIG = {
    API_URL: "https://script.google.com/macros/s/AKfycby1WJPnVCQxSqeFoh9ZdZX0LU7BXgdNTDg5DWqOawZ3yq-tVbi5oZh5Die2idnYoaKr/exec"
  };
  var tasks = [];

  function fmtDate(d){ var p=String(d).split("/"); if(p.length<3) return d;
    var wd=["日","月","火","水","木","金","土"][ new Date(+p[0],+p[1]-1,+p[2]).getDay() ];
    return (+p[1])+"月"+(+p[2])+"日("+wd+")"; }

  function load(){
    document.getElementById("hsub").textContent="承認待ちを読み込み中…";
    if(!CONFIG.API_URL){ render([]); return; }
    fetch(CONFIG.API_URL+"?role=host")
      .then(function(r){return r.json();})
      .then(function(d){ tasks=d.tasks||[]; render(tasks); })
      .catch(function(){ document.getElementById("hsub").textContent="読み込みに失敗しました"; });
  }

  function render(list){
    document.getElementById("hsub").textContent="承認待ち "+list.length+" 件";
    var el=document.getElementById("list");
    if(!list.length){ el.innerHTML='<div class="empty">承認待ちはありません。<br>清掃者から報告が届くとここに表示されます。</div>'; return; }
    var h="";
    list.forEach(function(t){
      var photos="";
      if(t.photos && t.photos.length){
        photos='<div class="photos">'+t.photos.map(function(p){
          return '<div class="ph"><a href="'+p.view+'" target="_blank" rel="noopener"><img src="'+p.thumb+'" alt="清掃写真"></a></div>';
        }).join("")+'</div>';
      } else {
        photos='<div class="no-photo">（写真なし）</div>';
      }
      h+='<div class="card" id="card-'+t.id+'">'
        +'<div class="c-head"><div class="c-top"><span class="c-fac">'+t.facility+'</span>'
        +'<span class="pill">承認待ち</span></div>'
        +'<div class="c-meta">'+fmtDate(t.date)+' の清掃　担当：'+(t.cleaner||"未割当")
        +(t.reportedAt?'　報告 '+t.reportedAt:'')+'</div></div>'
        +photos
        +'<div class="acts">'
        +'<button class="btn btn-ng" onclick="reject(\''+t.id+'\')">差し戻し</button>'
        +'<button class="btn btn-ok" onclick="approve(\''+t.id+'\')">承認する</button>'
        +'</div></div>';
    });
    el.innerHTML=h;
  }

  function post(body, cardId, btnLabel){
    var card=document.getElementById("card-"+cardId);
    if(card){ card.querySelectorAll("button").forEach(function(b){ b.disabled=true; }); }
    if(!CONFIG.API_URL){ removeCard(cardId); return; }
    fetch(CONFIG.API_URL, { method:"POST", body:JSON.stringify(body) })
      .then(function(r){return r.json();})
      .then(function(res){ if(res && res.ok){ removeCard(cardId); } else { throw new Error(res&&res.error||"失敗"); } })
      .catch(function(e){
        if(card){ card.querySelectorAll("button").forEach(function(b){ b.disabled=false; }); }
        alert("送信に失敗しました。通信を確認して再度お試しください。");
      });
  }

  function removeCard(id){
    var card=document.getElementById("card-"+id);
    if(card) card.parentNode.removeChild(card);
    tasks=tasks.filter(function(t){return t.id!==id;});
    document.getElementById("hsub").textContent="承認待ち "+tasks.length+" 件";
    if(!tasks.length) render([]);
  }

  function approve(id){
    if(!confirm("この清掃を承認します。よろしいですか？")) return;
    post({ action:"approve", taskId:id }, id);
  }
  function reject(id){
    var reason=prompt("差し戻しの理由を入力してください（清掃者に伝わります）");
    if(reason===null) return;
    post({ action:"reject", taskId:id, reason:reason }, id);
  }

  load();
</script>
</body>
</html>
