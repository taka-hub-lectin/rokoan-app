<title>ロコ庵 運営ハブ</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  header{
    position:sticky;top:0;z-index:10;background:var(--blue);color:#fff;
    padding:18px 18px calc(16px + env(safe-area-inset-bottom,0)) 18px;
    box-shadow:0 2px 10px rgba(46,106,153,.25);
  }
  .h-title{font-size:21px;font-weight:700;letter-spacing:.02em;}
  .h-sub{font-size:13px;opacity:.92;margin-top:3px;}
  main{max-width:680px;margin:0 auto;padding:16px 12px 40px;}
  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:520px){.grid{grid-template-columns:1fr 1fr;}}
  .card{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;min-height:84px;box-shadow:0 1px 3px rgba(34,48,60,.05);
    transition:transform .12s, box-shadow .12s;
  }
  .card:active{transform:scale(.99);}
  .ico{
    flex:none;width:52px;height:52px;border-radius:14px;background:#EAF2F9;
    display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .c-body{flex:1;min-width:0;}
  .c-title{font-size:17px;font-weight:700;}
  .c-desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .arrow{flex:none;color:var(--blue);font-size:20px;font-weight:700;}
  .card.soon{opacity:.55;pointer-events:none;border-style:dashed;}
  .card.soon .ico{background:#EEF1F4;}
  .badge{font-size:11px;font-weight:700;color:var(--muted);
    border:1px solid var(--line);border-radius:99px;padding:2px 8px;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
</style>
</head>
<body>
<header>
  <div class="h-title">ロコ庵 運営ハブ</div>
  <div class="h-sub">機能はここから。今後ここに増えていきます</div>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>新しい機能を足すときは README.md を参照</footer>

<script>
// ===== 機能の登録表（ここに1行足す＝機能が1つ増える）=====
const MODULES = [
  { name:"清掃チェック", desc:"退室後の掃除チェックリスト", icon:"🧹", url:"cleaning.html", ready:true },
  { name:"業務分担表", desc:"業務の役割分担一覧", icon:"📋", url:"handover.html", ready:true },
  { name:"（今後追加）", desc:"_template.html を複製してここに登録", icon:"➕", url:"#", ready:false },
];

const grid = document.getElementById("grid");
MODULES.forEach(m => {
  const a = document.createElement("a");
  a.className = "card" + (m.ready ? "" : " soon");
  a.href = m.ready ? m.url : "#";
  a.innerHTML = `
    <div class="ico">${m.icon}</div>
    <div class="c-body">
      <div class="c-title">${m.name}</div>
      <div class="c-desc">${m.desc}</div>
    </div>
    ${m.ready ? '<div class="arrow">›</div>' : '<div class="badge">準備中</div>'}`;
  grid.appendChild(a);
});
</script>
</body>
